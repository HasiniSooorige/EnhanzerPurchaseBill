<div class="login-page">

  <div class="login-card">

    <!-- Login Header -->
    <div class="login-header">

      <h1>Enhanzer</h1>

      <p class="subtitle">
        Purchase Bill Management
      </p>

      <p class="welcome-text">
        Welcome back! Please sign in to continue.
      </p>

    </div>

    <form
      (ngSubmit)="onLogin()"
      #loginForm="ngForm"
      novalidate
    >

      <!-- Email Field -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailModel="ngModel"
          required
          email
          maxlength="254"
          autocomplete="username"
          placeholder="Enter your email address"
          [class.invalid]="emailModel.invalid && (emailModel.touched || loginForm.submitted)"
          [attr.aria-invalid]="emailModel.invalid && (emailModel.touched || loginForm.submitted)"
          [disabled]="isLoading"
        />

        <small
          class="field-error"
          *ngIf="emailModel.touched && emailModel.errors?.['required']"
        >
          Email address is required.
        </small>

        <small
          class="field-error"
          *ngIf="emailModel.touched && emailModel.errors?.['email']"
        >
          Please enter a valid email address.
        </small>

        <small
          class="field-error"
          *ngIf="emailModel.touched && emailModel.errors?.['maxlength']"
        >
          Email address is too long.
        </small>

      </div>

      <!-- Password Field -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            #passwordModel="ngModel"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
            [class.invalid]="passwordModel.invalid && (passwordModel.touched || loginForm.submitted)"
            [attr.aria-invalid]="passwordModel.invalid && (passwordModel.touched || loginForm.submitted)"
            [disabled]="isLoading"
          />

          <!-- Password Visibility Toggle -->
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.title]="showPassword ? 'Hide password' : 'Show password'"
          >

            <!-- Show Password Icon -->
            <svg
              *ngIf="!showPassword"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>

            <!-- Hide Password Icon -->
            <svg
              *ngIf="showPassword"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3l18 18"/>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
              <path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.8"/>
              <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>
            </svg>

          </button>

        </div>

        <small
          class="field-error"
          *ngIf="passwordModel.touched && passwordModel.errors?.['required']"
        >
          Password is required.
        </small>

      </div>

      <!-- Reusable API Error Message -->
      <app-alert-message
        [message]="errorMessage"
        type="error"
      />

      <!-- Login Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading || loginForm.invalid"
      >
        <span *ngIf="!isLoading">
          Sign In
        </span>

        <span *ngIf="isLoading">
          Signing in...
        </span>
      </button>

    </form>

    <!-- Footer -->
    <p class="login-footer">
      Secure access to Purchase Bill Management
    </p>

  </div>

</div>
